
name: ShopEase CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run application tests
        run: bash tests/test-app.sh

      - name: Build Docker image
        run: docker build -t shopease:${{ github.sha }} .
