
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase | Online Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <h1>ShopEase</h1>
    <div class="cart">🛒 Cart: <span id="cart-count">0</span></div>
  </header>

  <section class="hero">
    <h2>Welcome to ShopEase</h2>
    <p>Discover great products at great prices.</p>
    <a href="#products" class="shop-button">Shop Now</a>
  </section>

  <main id="products" class="products">
    <h2>Featured Products</h2>
    <div class="product-grid">
      <article class="product-card">
        <div class="product-image">🎧</div>
        <h3>Wireless Headphones</h3>
        <p>₹1,499</p>
        <button class="add-cart">Add to Cart</button>
      </article>

      <article class="product-card">
        <div class="product-image">⌚</div>
        <h3>Smart Watch</h3>
        <p>₹2,499</p>
        <button class="add-cart">Add to Cart</button>
      </article>

      <article class="product-card">
        <div class="product-image">🎒</div>
        <h3>Travel Backpack</h3>
        <p>₹999</p>
        <button class="add-cart">Add to Cart</button>
      </article>
    </div>
  </main>

  <footer>
    <p>© 2026 ShopEase | DevOps Internship Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
